[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profilemesh-goai"
version = "0.1.0"
description = "OrgSight GOAI local MCP read service"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.29,<1.30",
  "python-dotenv>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
profilemesh-goai-mcp = "profilemesh_goai.mcp_server:main"
profilemesh-goai-web = "profilemesh_goai.web_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/profilemesh_goai"]
