[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orgsight-goai"
version = "0.1.0"
description = "OrgSight GOAI local MCP read service"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mcp>=1.29,<1.30",
  "python-dotenv>=1.0,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
orgsight-mcp = "orgsight.mcp_server:main"
orgsight-web = "orgsight.web_app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orgsight"]
