apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: person-profile-worker
spec:
  model: deepseek-v4-flash
  runtime: qwenpaw
  package: packages/person-profile-worker.zip
  # 首轮真实联调需要启动；MCP 调用仍要求已有对应 Task Grant。
  mcpServers:
    - name: orgsight
      url: http://host.docker.internal:8787/mcp
      transport: http
  state: Running
